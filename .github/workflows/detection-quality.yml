name: Detection quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matlab-room:
    needs: audio-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: detection-quality
          path: results/detection-quality
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab'); verify_room_quality
  audio-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: make incident-build
      - name: Development comparison
        run: python experiments/detection_quality/run_quality.py --split development --c-library build/libdetection.so
      - name: Frozen candidate on withheld waveforms
        run: python experiments/detection_quality/run_quality.py --split heldout --c-library build/libdetection.so
      - name: Previously seen public-audio transfer diagnostic
        run: |
          python scripts/fetch_real_audio.py
          python experiments/detection_quality/real_diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detection-quality
          path: results/detection-quality/
          retention-days: 30
